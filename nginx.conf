server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Página: o navegador sempre confere se mudou (responde 304 rápido quando
    # não mudou), senão quem já visitou fica vendo a versão antiga.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Fotos: cache normal. Ao trocar uma foto, usar nome de arquivo novo.
    location /images/ {
        try_files $uri =404;
    }
}
